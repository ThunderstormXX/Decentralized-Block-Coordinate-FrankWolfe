[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbcfw-llm-posttrain"
version = "0.1.0"
description = "Artifact-safe smoke harness for nuclear-norm Frank-Wolfe SFT and KL-constrained LLM RL."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.3",
  "transformers>=4.46,<5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dbcfw-llm = "dbcfw_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
